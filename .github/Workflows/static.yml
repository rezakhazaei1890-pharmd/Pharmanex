
name: Build, Diagnose and Deploy PHARMANEX V2

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-articles:
    name: Diagnose and Test Scientific Article API
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Diagnose repository structure
        run: |
          echo "Repository root:"
          pwd

          echo "Root files:"
          ls -la

          echo "Version2 files:"
          ls -la version2

          echo "Server files:"
          find version2/server -maxdepth 4 -type f -print || true

          echo "Checking test file:"
          if [ -f "version2/server/tests/articles.test.js" ]; then
            echo "TEST FILE FOUND"
          else
            echo "TEST FILE NOT FOUND"
            exit 1
          fi

      - name: Install dependencies
        working-directory: version2
        run: npm install

      - name: Test real scientific article search
        working-directory: version2
        run: npm run test:articles

  build-and-deploy:
    name: Build and Deploy Website
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and build V2
        working-directory: version2
        run: |
          npm install
          npm run build

      - name: Prepare deployment
        run: |
          mkdir -p site/version2
          cp -R version2/dist/. site/version2/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
